<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavir's school admission</title> <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Kavir's school admission</h1>
<p> Please fill out the form below to apply for admission.</p>

<section>
    <h2>Student Information</h2>
    <p>student's name</p>
    <input type="text">

    <p>student's age</p>
    <input type="number">
    <p>student's class</p>
    <select>
        <option >class 4 </option>
        <option >class 5 </option>
        <option >class 6 </option>
    </select>
</section>

<section>
    <h2>Choose your gender</h2>
    <p></p>
    <input type="radio"  name="gender" >
    <label for="male">Male</label>
    <input type="radio"  name="gender" >
    <label for="female">Female</label>
</section>

<section>
    <h2>Choose your hobbies</h2>
    <input type="checkbox" >football <br>
    <input type="checkbox" >cricket <br>
    <input type="checkbox" >table tennis <br>
    <input type="checkbox" >chess <br>
</section>


<section>
    <h2>Parent's Information</h2>
    <p>parent's name</p>
    <input type="text">

    <p>email</p>
    <input type="email">
    </section>

    <section>
    <button>Submit Application</button>
    </section>
</body>
</html>
